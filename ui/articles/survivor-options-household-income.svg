<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Survivor option comparison over ten years</title>
  <desc id="desc">Original LEOFF Helper graphic comparing LEOFF survivor options using the Washington DRS example monthly pension amounts and showing how much survivor income would be paid over ten years after the retiree's death.</desc>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <rect x="28" y="28" width="904" height="504" rx="24" fill="#fffaf3" stroke="#d8d0c4"/>

  <text x="68" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2F44">
    How Survivor Elections Change Household Income
  </text>
  <text x="68" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b544b">
    Based on the Washington DRS example of a $2,122 monthly single-life pension with member and survivor within 5 years of the same age.
  </text>

  <text x="92" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F4D3A">
    Monthly pension while retiree is alive
  </text>
  <text x="520" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2F44">
    Survivor pension if survivor lives 10 more years
  </text>

  <text x="72" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4f4941">Single life</text>
  <rect x="170" y="202" width="260" height="22" rx="11" fill="#6B4F3A"/>
  <text x="442" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B4F3A">$2,122/mo</text>
  <rect x="620" y="202" width="2" height="22" rx="1" fill="#d8d0c4"/>
  <text x="636" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#DB2B39">$0 over 10 years</text>

  <text x="72" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4f4941">100% survivor</text>
  <rect x="170" y="262" width="216" height="22" rx="11" fill="#1F4D3A"/>
  <text x="398" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4D3A">$1,763/mo</text>
  <rect x="620" y="262" width="254" height="22" rx="11" fill="#1F4D3A"/>
  <text x="884" y="279" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4D3A">$211,560</text>

  <text x="72" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4f4941">66.67% survivor</text>
  <rect x="170" y="322" width="229" height="22" rx="11" fill="#3F7C85"/>
  <text x="411" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3F7C85">$1,869/mo</text>
  <rect x="620" y="322" width="178" height="22" rx="11" fill="#3F7C85"/>
  <text x="808" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3F7C85">$147,960</text>

  <text x="72" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4f4941">50% survivor</text>
  <rect x="170" y="382" width="236" height="22" rx="11" fill="#8C5E58"/>
  <text x="418" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8C5E58">$1,926/mo</text>
  <rect x="620" y="382" width="139" height="22" rx="11" fill="#8C5E58"/>
  <text x="769" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8C5E58">$115,560</text>

  <rect x="68" y="448" width="824" height="54" rx="16" fill="rgba(31,77,58,0.08)" stroke="rgba(31,77,58,0.10)"/>
  <text x="88" y="479" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2A2A2A">
    Takeaway: higher survivor protection usually lowers the retiree's monthly pension now, but preserves more household income after a death.
  </text>
</svg>
