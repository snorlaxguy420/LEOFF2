<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Sequence risk comparison</title>
  <desc id="desc">An original LEOFF Helper illustration showing two retirees with the same six annual returns and the same withdrawals, but different ending balances because losses happen early in one sequence and late in the other.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f5ee"/>
      <stop offset="100%" stop-color="#efe7dc"/>
    </linearGradient>
  </defs>
  <rect width="920" height="520" fill="url(#bg)"/>
  <rect x="30" y="30" width="860" height="460" rx="24" fill="#fffaf3" stroke="#d9d0c4"/>

  <text x="70" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2F44">
    Same Average Returns, Very Different Retirement Outcome
  </text>
  <text x="70" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4a5560">
    Hypothetical example: $1,000,000 start, $60,000 annual withdrawals, same six annual returns in different order.
  </text>

  <line x1="110" y1="390" x2="800" y2="390" stroke="#8a8175" stroke-width="2"/>
  <line x1="110" y1="150" x2="110" y2="390" stroke="#8a8175" stroke-width="2"/>

  <line x1="110" y1="330" x2="800" y2="330" stroke="#e9e1d5" stroke-width="1"/>
  <line x1="110" y1="270" x2="800" y2="270" stroke="#e9e1d5" stroke-width="1"/>
  <line x1="110" y1="210" x2="800" y2="210" stroke="#e9e1d5" stroke-width="1"/>

  <text x="84" y="394" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">$500k</text>
  <text x="84" y="334" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">$650k</text>
  <text x="84" y="274" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">$800k</text>
  <text x="84" y="214" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">$950k</text>

  <text x="110" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Start</text>
  <text x="220" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 1</text>
  <text x="330" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 2</text>
  <text x="440" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 3</text>
  <text x="550" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 4</text>
  <text x="660" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 5</text>
  <text x="770" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a5248">Year 6</text>

  <polyline fill="none" stroke="#DB2B39" stroke-width="5" points="110,190 220,294 330,347 440,341 550,340 660,344 770,349"/>
  <polyline fill="none" stroke="#1F4D3A" stroke-width="5" points="110,190 220,160 330,152 440,132 550,104 660,174 770,159"/>

  <circle cx="770" cy="349" r="7" fill="#DB2B39"/>
  <circle cx="770" cy="159" r="7" fill="#1F4D3A"/>

  <text x="792" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4D3A">
    Late losses
  </text>
  <text x="792" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1F4D3A">
    End balance: $724k
  </text>

  <text x="792" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#DB2B39">
    Early losses
  </text>
  <text x="792" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#DB2B39">
    End balance: $599k
  </text>

  <rect x="110" y="447" width="18" height="4" rx="2" fill="#DB2B39"/>
  <text x="136" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5a5248">
    Sequence A returns: -20%, -10%, +12%, +10%, +8%, +8%
  </text>

  <rect x="470" y="447" width="18" height="4" rx="2" fill="#1F4D3A"/>
  <text x="496" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5a5248">
    Sequence B returns: +8%, +8%, +10%, +12%, -10%, -20%
  </text>

  <text x="70" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b6257">
    Illustration generated by LEOFF Helper. The two paths use the same set of returns, but withdrawals magnify the damage when losses happen early.
  </text>
</svg>
